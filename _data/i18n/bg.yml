      title: Нашата мисия
      text: Да служим на хората чрез добри и полезни дела.
    - icon: people
      title: Какво правим
      text: Организираме проекти и събития в полза на общността в Пловдив и региона.
    - icon: heart
      title: Включи се
      text: Стани доброволец, партньор или дарител и ни помогни да направим повече.

