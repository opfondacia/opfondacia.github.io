history_page:
  title: История
  text: "„Богатството, спечелено с честен труд, трябва да служи човеку, да върши добри и полезни дела“"
  moments_heading: Ключови моменти           # visually hidden; keeps the heading levels from skipping from h1 to h3
  # `photo` is a path under assets/images/history/; `alt` describes the image (no visible caption).
  moments:
    - photo: /assets/images/history/home-2.webp
      width: 448
      height: 600
      alt: "Дом на благотворителността"
      paragraphs:
        - "Денят е 8 ноември 1927 г. – Димитровден и Празник на народния дарител. Пловдив не е изразявал такова преклонение пред делото на един човек. Никога пловдивчани не са се издигали тъй високо като дух и съзнание при изпълнението на своя дълг на признателност. За този ден Димитър Кудоглу е мечтал повече от десет години – от първия миг, когато се ражда идеята да създаде със собствени средства болница, в която да се лекуват не само бежанците от Беломорието, но и всички прокудени от Тракия и Македония, както и бедните пловдивчани. Това дарение той прави на целия български народ и от него ще могат да се възползват всички граждани, без значение тяхната вяра и народност."
        - "Заедно с Дома той дарява и два тютюневи склада, намиращи се на улица „Иван Вазов“, на стойност 15 млн. лева. Приходите от наемите ще издържат диспансера. Наемател на тези постройки е той самият, като така внася ежегодно по 800 хил. лева в бюджета на Дома. По негово изрично желание освещаването е трябвало да стане съвсем скромно, но народът му придава такава сърдечност и тържественост, на каквато Пловдив не е ставал свидетел дотогава. Създаването на Дома на благотворителността е обвързано със специален закон, подготвен от българския министър-председател Андрей Ляпчев и приет единодушно със ставане на крака и няколкоминутна акламация от Народното събрание на 21 декември 1926 г."
    - photo: /assets/images/history/kudoglu-young.webp
      width: 1086
      height: 1614
      alt: "Димитър Кудоглу в млади години"
      paragraphs:
        - "Благодетеля, както наричат тогава Кудоглу, дарява приживе огромна част от богатството си, вижда с очите си плодовете на благочестивото си дело и се радва на признателността и благодарността на своя народ. Самият той е заявявал, че:"
        - "„Намирал съм смисъл в живота, радост и щастие само тогава, когато съм можел да направя нещо добро, да бъда полезен на народа си, на бедните, на страдащите“"
        - "Роден на 21 август 1862 г. в семейството на Петър и Стана Кудоглу, добри българи и благочестиви християни, Димитър Кудоглу носи в душата си още от най-крехка възраст любов към ближния и вяра в Бога. Това са и ръководните начала във всички постъпки и дейности на благодетеля."
    - photo: /assets/images/history/ephorate.webp
      width: 1400
      height: 1110
      alt: "Ефорията, управляваща Дом на благотворителността"
      paragraphs:
        - "Делото на скромния и бележит българин от село Габрово, Ксантийско, съставлява днес една от най-възвишените изяви на племето ни. То е не само израз на ефикасната грижа за здравето на нацията, не само издигнат храм на благотворителността, но и един неопровержим документ за високите морални и духовни сили на българина. Това е най-голямото по замисъл и обществена полза дарение."
        - "Домът става най-важният фактор за физическото и духовно възраждане на пловдивското население. Дейността на лекарите в Дома подпомага решаването на няколко основни проблема. На първо място е високата детска смъртност. Също така в Пловдив и другите големи градове високата смъртност на населението се дължи на туберколозата, обявена по онова време за най-опасната болест. България по това време е на първо място в Европа по смъртност на деца от туберколоза. Много важна е и дейността на отдела за борба с венерическите заболявания, където пациентите се лекуват при спазване на необходимата дискретност."
    - photo: /assets/images/history/kudoglu-portrait.webp
      width: 659
      height: 800
      alt: "Портрет на Димитър Кудоглу"
      paragraphs:
        - "Доброто дело на Кудоглу е трябвало да бъде пример за подражание на другите богати хора. Домът на благотворителността е пример за най-висшия човешки и обществен дълг към страдащото население. Хората пристъпвали с чувство на благоговение през прага на този дом на човешкото дело и излизали с по-голяма вяра в хората и в доброто."
    - photo: /assets/images/history/kudoglu-and-maria.webp
      width: 479
      height: 734
      alt: "Димитър Кудоглу и Мария Братанова – последната снимка на благодетеля"
      paragraphs:
        - "В един топъл мартенски ден Димитър Кудоглу е на балкона на къщата на племенника си, на улица „Гладстон“, и разговаря с неговата дъщеря Мария. Той я чувства като най-близкия си човек. Осигурил е обучението ѝ в най-престижните учебни заведения в Париж и тя израства в дома му в Дрезден. Тя е и единственият продължител на неговия род. Разговарят за последствията от започналата война, за настъпващата пролет. Кудоглу гледа от балкона с умиление величествената снага на сградата на Дома и казва на Мария: „Мери, душата ми се пълни, като гледам Дома. Това е моята истинска рожба!“"
        - "На 7 март 1940 г. Димитър Кудоглу за последен път затваря очи с удовлетворението на човек, обезсмъртил делото си със създадения приживе несъкрушим паметник – не от студен гранит или мрамор, а жив в сърцата и душите, който ще продължи да твори добрини и ще бъде необходим на хората. Той така е организирал дейността на фондацията за издръжка на Дома, че неговата смърт не нарушава нормалната работа. Историците изчисляват, че общо за времето на съществуването на Дома дарението му възлиза на над 41 милиона лева. Няколко месеца след смъртта му, по изричното му завещание, съпругата му Екатерина дарява на Пловдивската община място, за да бъде построен детски дневен дом."
    - photo: /assets/images/history/home.webp
      width: 1400
      height: 832
      alt: "Дом на благотворителността"
      paragraphs:
        - "През месец май 1951 г. пловдивчани са потресени от разрушаването на бюст-паметника на Димитър Кудоглу в градината „Цар Симеон“. Пак през 1951 г. е закрита и фондацията „Дом на благотворителността и народното здраве“ с указ на президиума на Народното събрание. Чрез него с лека ръка се премахва една вековна традиция, датираща още от българските царе през Средновековието, които са дарявали имоти за църкви, манастири и др. През 1973 г. в управленските среди се ражда идеята да се разшири Централна поща. Така ще може да бъде построен един нов монументален паметник на социализма, а и ще бъде доизличена паметта за благодетеля. За тази цел е ликвидирана сградата на Дома на благотворителността и народното здраве, а след това е изличен и споменът за него. Свалена е и бронзовата плоча с барелеф на Благодетеля и надпис „Улица Кудоглу“. Няма я вече тази малка, но толкова значима за пловдивчани уличка в центъра на града."
        - "По неведоми пътища собственият имот на Д. Кудоглу южно от гарата, където през 1929–1950 г. е Противобясната станция, е продаден от Община Пловдив и на негово място се простира голям супермаркет. Продадено е и мястото на бившата детска ясла, където днес се извисява хотел и ресторант с причудливото име."

