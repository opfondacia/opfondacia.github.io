hero:
  eyebrow: Пловдив · район Централен
  title: Фондация „Димитър П. Кудоглу“
  text: Добрите и полезни дела започват с човечност. Обединяваме хора, за да помагаме на нуждаещите се.
  cta_events: Нашите събития
  cta_involved: Включи се

quote:
  text: „Богатство, спечелено с честен труд, трябва да служи на човек да върши добри и полезни дела. Намирал съм смисъл в живота, радост и щастие само тогава, когато съм можел да направя нещо добро, да бъда полезен на народа си, на бедните, на страдащите.“
  author: Димитър П. Кудоглу

